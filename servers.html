<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mehfooz MD — Server Directory</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body { background: radial-gradient(circle at top right, #0a192f 0%, #030814 60%); color: #e2e8f0; min-height: 100vh; padding: 30px 16px; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; color: #fff; font-weight: 900; margin-bottom: 4px; }
  h1 span { color: #00ff88; }
  .sub { font-size: 12px; color: #94a3b8; margin-bottom: 24px; }
  .card { background: rgba(10,22,40,0.85); border: 1px solid rgba(0,255,136,0.25); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .card:hover { border-color: #00ff88; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #00ff88; box-shadow: 0 0 8px #00ff88; flex-shrink: 0; }
  .name { font-size: 14px; font-weight: 700; color: #fff; }
  .link { font-size: 10px; color: #94a3b8; margin-top: 2px; word-break: break-all; }
  .empty { font-size: 12px; color: #64748b; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Mehfooz <span>MD</span> — Servers</h1>
    <div class="sub">Apna server chunein</div>
    <div id="list"></div>
  </div>

  <script>
    // ─── Yahan naya server add karein ───
    // Har naye Heroku app ke baad, yahan ek nayi line add kar dein:
    // { name: "Server ka naam", url: "https://your-new-app.herokuapp.com" }
    const SERVERS = [
      { name: "Server 1", url: "https://mehfooz.herokuapp.com" }
      // { name: "Server 2", url: "https://your-second-app.herokuapp.com" },
    ];

    const list = document.getElementById('list');
    if (SERVERS.length === 0) {
      list.innerHTML = '<div class="empty">Koi server add nahi kiya gaya abhi tak.</div>';
    } else {
      list.innerHTML = SERVERS.map(s => `
        <a class="card" href="${s.url}" target="_blank">
          <span class="dot"></span>
          <span>
            <div class="name">${s.name}</div>
            <div class="link">${s.url}</div>
          </span>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
